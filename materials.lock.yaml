apiVersion: materials.productive-k3s.io/v1alpha1
kind: MaterialsLock
metadata:
  owner: productive-k3s-infra
  package: productive-k3s-infra
  version: 0.9.65-0.9.6
spec:
  materials:
    - {id: productive-k3s-core, type: product-artifact, name: productive-k3s-core, version: 0.9.6, source: "https://github.com/productive-k3s/productive-k3s-core", pinPolicy: exact, required: true}
    - id: python-ci
      type: binary
      name: python
      version: 3.11.17
      source: https://github.com/actions/python-versions
      pinPolicy: exact-toolchain
      required: true
      scope: development
      distribution: excluded
      usedBy:
        - .github/workflows/docs.yml
        - .github/workflows/pr-validation.yml
    - id: kcov
      type: binary
      name: kcov
      version: "43"
      source: https://github.com/SimonKagstrom/kcov
      pinPolicy: exact-checksum
      required: true
      scope: development
      distribution: excluded
      checksums:
        source-archive: sha256:4cbba86af11f72de0c7514e09d59c7927ed25df7cebdad087f6d3623213b95bf
      usedBy:
        - tests/bin/install-kcov.sh
        - tests/bin/run-kcov.sh
      updateSource:
        type: github-release
        repository: SimonKagstrom/kcov
  requirements:
    - {id: bash, type: binary, name: bash, version: "5.1", pinPolicy: minimum-supported, required: true}
    - {id: make, type: binary, name: make, version: "4.3", pinPolicy: minimum-supported, required: true}
    - {id: opentofu, type: binary, name: opentofu, version: "1.12.6", source: "https://github.com/opentofu/opentofu", pinPolicy: exact-when-profile-requires, required: false}
    - {id: multipass, type: binary, name: multipass, version: "1.14", pinPolicy: minimum-supported, required: false}
    - {id: ansible-core, type: binary, name: ansible-core, version: "2.15", pinPolicy: minimum-supported, required: false}
    - id: kcov-build-host
      type: os-image
      name: ubuntu
      version: "24.04"
      source: https://github.com/actions/runner-images
      pinPolicy: release-series
      required: true
      scope: development
      distribution: excluded
      note: Provides CMake, compiler, and signed Ubuntu build-library packages for CI only.
